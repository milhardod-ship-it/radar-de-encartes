# Robô de coleta: busca os encartes nos sites dos mercados, atualiza os dados e publica.
# Também dá para rodar à mão na aba "Actions" do GitHub.
# Horários em UTC (Rio = UTC−3). O GitHub pode atrasar execuções agendadas em horários de pico.
name: Coletar encartes

on:
  schedule:
    # A cada 2 horas (em UTC; Rio = UTC−3). O GitHub costuma atrasar as passadas agendadas em 1 a 3 horas,
    # então passadas frequentes garantem que encarte novo entre logo. Sem custo extra: a leitura por IA só roda
    # quando sai encarte novo, e o robô de coleta é gratuito.
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Leitor de PDF (folhetos do Atacadão)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick
      - name: Coletar (segue mesmo se um mercado falhar)
        id: coleta
        run: npm run coletar || echo "falhou=1" >> "$GITHUB_OUTPUT"
      - name: Ler encartes em imagem com IA (Guanabara; só se houver encarte novo)
        id: leitura
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEITOR_MODELO: claude-sonnet-5-5
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "Sem chave da API: pulei."; exit 0; fi
          npm run ler-encartes || echo "falhou=1" >> "$GITHUB_OUTPUT"
      - name: Padronizar fotos dos produtos (fundo transparente, mesmo tamanho)
        run: npm run fotos || echo "fotos falharam; o app usa as originais"
      - name: Importar, testar e conferir o build
        run: npm run build && npm test
      - name: Salvar dados novos
        run: scripts/salvar.sh "Robô: encartes atualizados em $(date -u +%Y-%m-%d)"
      - name: Avisar falha de coleta
        if: steps.coleta.outputs.falhou == '1' || steps.leitura.outputs.falhou == '1'
        run: |
          echo "::error::Algum mercado falhou na coleta ou na leitura por IA. Veja os passos acima (o site pode ter mudado)."
          exit 1
