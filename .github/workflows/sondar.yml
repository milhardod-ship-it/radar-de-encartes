# Sonda um site de mercado (robô identificado, sem disfarce) para ver se dá para coletar o encarte.
name: Sondar site
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Endereços separados por espaço'
        required: true
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sondar -- $URLS
        env:
          URLS: ${{ inputs.urls }}
